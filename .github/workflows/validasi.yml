name: Validasi kosakata
on:
  push:
    paths: ["words.json", "scripts/**"]
  pull_request:
    paths: ["words.json", "scripts/**"]
jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate.py
